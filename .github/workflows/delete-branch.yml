# Delete a branch (e.g. the e2e-results branch once its files have been fetched). Manual only.
name: delete-branch
on:
  workflow_dispatch:
    inputs:
      branch: { description: "branch to delete (never main)", required: true }
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - env: { BRANCH: "${{ inputs.branch }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          [ "$BRANCH" != main ] || { echo "refusing to delete main"; exit 1; }
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
